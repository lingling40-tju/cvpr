BASE_TASK_CONFIG_PATH: ../../configs/r2r_fitdev_task.yaml
SIMULATOR_GPU_IDS:
- 0
- 1
- 2
- 3
TORCH_GPU_ID: 0
TORCH_GPU_IDS:
- 0
- 1
- 2
- 3
TRAINER_NAME: GRPO-R1
ENV_NAME: R1Env
GPU_NUMBERS: 4
NUM_ENVIRONMENTS: 2
TENSORBOARD_DIR: data/logs/tensorboard_dirs/etp_r1_macro_seed11/
CHECKPOINT_FOLDER: data/logs/checkpoints/etp_r1_macro_seed11/
RESULTS_DIR: data/logs/results/etp_r1_macro_seed11/
ONLY_LAST_SAVEALL: true
INFERENCE:
  SPLIT: test
  USE_CKPT_CONFIG: false
  SAMPLE: false
  CKPT_PATH: ''
  PREDICTIONS_FILE: ''
  FORMAT: r2r
  EPISODE_COUNT: -1
EVAL:
  USE_CKPT_CONFIG: false
  SPLIT: development256
  EPISODE_COUNT: -1
  EPISODE_ID: null
  CKPT_PATH_DIR: ''
  fast_eval: false
IL:
  iters: 15000
  log_every: 200
  lr: 1e-5
  batch_size: 1
  ml_weight: 1.0
  expert_policy: spl
  sample_ratio: 0.75
  decay_interval: 3000
  warmup_iters: 1000
  min_lr_ratio: 0.1
  max_traj_len: 15
  max_text_len: 150
  loc_noise: 0.5
  waypoint_aug: false
  ghost_aug: 0.0
  back_algo: teleport
  tryout: true
  ckpt_to_load: data/checkpoints/ckpt.0.pth
GRPO:
  iters: 64
  log_every: 1
  lr: 2.0e-05
  batch_size: 2
  max_traj_len: 15
  max_text_len: 150
  loc_noise: 0.5
  waypoint_aug: true
  ghost_aug: 0.0
  back_algo: teleport
  tryout: true
  ckpt_to_load: data/logs/checkpoints/release_r2r_dagger/store/ckpt.iter25000.pth
  warmup_iters: 0
  min_lr_ratio: 0.25
  sample_num: 4
  grpo_epsilon: 0.2
  grpo_beta: 0.04
  max_grad_norm: 2.0
  update_epochs: 1
  dropout_rate: 0.1
  train_all: false
  enable_amp: false
  enable_all_dropouts: true
  dropout_in_sampling: true
  T_start: 2.0
  T_end: 1.0
  load_from_ckpt: true
  is_requeue: false
MODEL:
  task_type: r2r
  policy_name: R1Policy
  NUM_ANGLES: 12
  pretrained_path: pretrained/r2r_rxr_ce/mlm.sap_habitat_depth/store2/model_step_367500.pt
  fix_lang_embedding: false
  fix_pano_embedding: false
  use_depth_embedding: true
  use_sprels: true
  merge_ghost: true
  consume_ghost: true
  spatial_output: false
  RGB_ENCODER:
    output_size: 512
  DEPTH_ENCODER:
    output_size: 256
  VISUAL_DIM:
    vis_hidden: 768
    directional: 128
  INSTRUCTION_ENCODER:
    bidirectional: true
SEED: 11
