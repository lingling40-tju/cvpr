ENVIRONMENT:
  MAX_EPISODE_STEPS: 5000
SIMULATOR:
  ACTION_SPACE_CONFIG: v0
  AGENT_0:
    SENSORS:
    - RGB_SENSOR
    - DEPTH_SENSOR
  FORWARD_STEP_SIZE: 0.25
  TURN_ANGLE: 15
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
    ALLOW_SLIDING: true
  RGB_SENSOR:
    WIDTH: 224
    HEIGHT: 224
    HFOV: 90
    TYPE: HabitatSimRGBSensor
  DEPTH_SENSOR:
    WIDTH: 256
    HEIGHT: 256
    HFOV: 90
  TYPE: Sim-v1
TASK:
  TYPE: VLN-v0
  POSSIBLE_ACTIONS:
  - STOP
  - MOVE_FORWARD
  - TURN_LEFT
  - TURN_RIGHT
  - HIGHTOLOW
  SUCCESS_DISTANCE: 3.0
  SENSORS:
  - INSTRUCTION_SENSOR
  INSTRUCTION_SENSOR_UUID: instruction
  MEASUREMENTS: []
  SUCCESS:
    SUCCESS_DISTANCE: 3.0
  SPL:
    SUCCESS_DISTANCE: 3.0
  NDTW:
    SUCCESS_DISTANCE: 3.0
    GT_PATH: data/datasets/R2R_VLNCE_v1-3_preprocessed/{split}/{split}_gt.json.gz
  SDTW:
    SUCCESS_DISTANCE: 3.0
    GT_PATH: data/datasets/R2R_VLNCE_v1-3_preprocessed/{split}/{split}_gt.json.gz
  ORACLE_SUCCESS:
    SUCCESS_DISTANCE: 3.0
DATASET:
  TYPE: VLN-CE-v2
  SPLIT: fit512
  SUFFIX: ''
  DATA_PATH: data/datasets/R2R_VLNCE_v1-3_preprocessed/{split}/{split}.json.gz
  SCENES_DIR: data/scene_datasets/
